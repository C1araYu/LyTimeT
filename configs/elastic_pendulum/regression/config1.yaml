seed: 1
log_dir: '../logs'
model_name: 'refine-sr'
data_filepath: '/root/data/physics_prediction_v2/data'
dataset: 'elastic_pendulum'
intrinsic_dimension: 6
niterations: 600
batch_size: 1000
num_frames: 60
maxsize: 40
warmup_maxsize_by: 0.2
complexity_of_constants: 1.0
complexity_of_variables: 1.0
binary_operators: ['+', '*', '-']
unary_operators: ['sin', 'square']
constraints: {
  'sin': 10,
  'square': 10,
  '*': [10, 10]
}
nested_constraints: {
  'sin': {
    'sin': 0,
    'square': 1,
  },
  'square': {
    'sin': 1,
    'square': 0,
  },
}
